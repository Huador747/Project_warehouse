<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <title>ประวัติซื้อ-ขาย</title>
    <link rel="stylesheet" href="../styles/history.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <button class="hamburger" id="hamburger-btn" aria-label="เมนูนำทาง">
        <span></span>
        <span></span>
        <span></span>
    </button>
    <div class="sidebar" id="sidebar">
      <div class="sidebar-nav-btn">
         <!-- User Profile Section -->
        <div class="user-profile-section">
          <div class="user-avatar-wrapper">
            <img id="userAvatar" src="" alt="User Avatar" class="user-avatar" style="display: none;" />
            <div class="online-indicator"></div>
          </div>
          <div class="user-info-text">
            <div id="userName" class="user-name">ผู้ใช้งาน</div>
            <div id="userRole" class="user-role">
              <span class="role-badge">User</span>
            </div>
          </div>
        </div>
        <button
          class="nav-btn"
          onclick="window.location.href='main.html'"
        >
          <span class="nav-icon">🏠</span> หน้าหลัก
        </button>
        <button class="nav-btn" onclick="window.location.href='buyin.html'">
          <span class="nav-icon">🛒</span> รายการซื้อ
        </button>
        <button class="nav-btn" onclick="window.location.href='sale.html'">
          <span class="nav-icon">💸</span> รายการขาย
        </button>
        <button class="nav-btn active" onclick="window.location.href='history.html'">
          <span class="nav-icon">📑</span> ประวัติการซื้อ-ขาย
        </button>
        <button class="nav-btn" onclick="window.location.href='inventory.html'">
          <span class="nav-icon">📦</span> สรุปจำนวนคงเหลือสินค้า
        </button>
        <button class="nav-btn" id="movement-btn" onclick="window.location.href='movement.html'" style="display:none;">
          <span class="nav-icon">📈</span> กราฟการเคลื่อนไหวสินค้าและจำนวนเงิน
        </button>
        <button
          class="nav-btn"
          id="dashboard-btn"
          onclick="window.location.href = '../backend/src/dashboard.html'"
          style="display: none"
        >
          <span class="nav-icon">📊</span> แดชบอร์ด
        </button>
      </div>
    </div>

    <div class="main-content">
        <div class="navbar">
            <form class="navbar-form">
                <span class="navbar-text active">ประวัติการซื้อ-ขาย</span>
                <select id="history-type" class="compact-select">
                    <option value="all">ทั้งหมด</option>
                    <option value="buyin">รายการซื้อ</option>
                    <option value="sale">รายการขาย</option>
                </select>
                <!-- เพิ่มดรอปดาวน์แยกปีและเดือน -->
                <select id="month-select">
                    <option value="all" class="compact-select">ทุกเดือน</option>
                </select>
                <select id="year-select">
                    <option value="all" class="compact-select">ทุกปี</option>
                </select>
            </form>
            <div class="search-logout-row">
                <input id="search-input" type="text" class="search-product-input"
                    placeholder="ค้นหาด้วยรหัส, ชื่อสินค้า หรือโมเดล...">
                <button class="logout-btn" id="logout-btn">ออกจากระบบ</button>
            </div>
        </div>
        <div class="history-list">
            <div class="history-table-wrapper">
                <table id="history-table">
                    <thead>
                        <tr>
                            <th>วันที่</th>
                            <th>ประเภท</th>
                            <th>รหัสสินค้า</th>
                            <th>ชื่อสินค้า</th>
                            <th>โมเดล</th>  
                            <th>หน่วยนับ</th>
                            <th>ราคาต่อหน่วย</th>
                            <th>จำนวน</th>
                            <th>ค่าขนส่ง</th>
                            <th>ภาษี7%</th>
                            <th>รวม</th>
                            <th>รวมทั้งหมด</th>
                            <th>ลูกค้า/ผู้ขาย</th>
                            <th>หมายเหตุ</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- เติมข้อมูลด้วย JS -->
                    </tbody>
                </table>
            </div>
            <!-- เพิ่ม pagination -->
            <div class="pagination-controls" id="pagination">
                <button id="prev-page" class="page-btn">ก่อนหน้า</button>
                <span id="page-info">หน้า 1 จาก 1</span>
                <button id="next-page" class="page-btn">ถัดไป</button>
            </div>
            <!-- เพิ่มส่วนสรุปยอด -->
            <div class="monthly-summary">
                <h3>สรุปยอดประจำเดือน</h3>
                <div class="summary-grid">
                    <div class="summary-box summary-buyin">
                        <div class="summary-label">
                            <!-- SVG เคลื่อนไหว: ยอดซื้อรวม -->
                            <svg width="22" height="22" viewBox="0 0 24 24"
                                style="vertical-align:middle;margin-right:6px;">
                                <rect x="3" y="6" width="18" height="2" fill="#e74c3c">
                                    <animate attributeName="width" values="0;18;0;18" dur="1.2s"
                                        repeatCount="indefinite" />
                                </rect>
                                <rect x="5" y="10" width="14" height="2" fill="#e74c3c">
                                    <animate attributeName="width" values="0;14;0;14" dur="1.2s"
                                        repeatCount="indefinite" begin="0.3s" />
                                </rect>
                                <rect x="7" y="14" width="10" height="2" fill="#e74c3c">
                                    <animate attributeName="width" values="0;10;0;10" dur="1.2s"
                                        repeatCount="indefinite" begin="0.6s" />
                                </rect>
                            </svg>
                            ยอดซื้อรวม
                        </div>
                        <div id="total-buyin" class="summary-value">-</div>
                    </div>
                    <div class="summary-box summary-sale">
                        <div class="summary-label">
                            <!-- SVG เคลื่อนไหว: ยอดขายรวม -->
                            <svg width="22" height="22" viewBox="0 0 24 24"
                                style="vertical-align:middle;margin-right:6px;">
                                <circle cx="12" cy="12" r="8" fill="#2ecc71">
                                    <animate attributeName="r" values="4;8;4" dur="1.2s" repeatCount="indefinite" />
                                </circle>
                                <rect x="11" y="4" width="2" height="8" fill="#fff">
                                    <animate attributeName="height" values="2;8;2" dur="1.2s"
                                        repeatCount="indefinite" />
                                </rect>
                            </svg>
                            ยอดขายรวม
                        </div>
                        <div id="total-sale" class="summary-value">-</div>
                    </div>
                    <div class="summary-box summary-count-buyin">
                        <div class="summary-label">
                            <!-- SVG เคลื่อนไหว: จำนวนรายการซื้อ -->
                            <svg width="22" height="22" viewBox="0 0 24 24"
                                style="vertical-align:middle;margin-right:6px;">
                                <circle cx="12" cy="12" r="10" fill="#ff9800">
                                    <animate attributeName="r" values="6;10;6" dur="1.2s" repeatCount="indefinite" />
                                </circle>
                                <text x="12" y="16" text-anchor="middle" font-size="12" fill="#fff">B</text>
                            </svg>
                            จำนวนรายการซื้อ
                        </div>
                        <div id="count-buyin" class="summary-value">-</div>
                    </div>
                    <div class="summary-box summary-count-sale">
                        <div class="summary-label">
                            <!-- SVG เคลื่อนไหว: จำนวนรายการขาย -->
                            <svg width="28" height="28" viewBox="0 0 28 28"
                                style="vertical-align:middle;margin-right:8px;">
                                <circle cx="14" cy="14" r="10" fill="#2196f3" opacity="0.2" />
                                <polyline points="9,15 13,19 19,11" fill="none" stroke="#2196f3" stroke-width="3">
                                    <animate attributeName="points"
                                        values="9,15 13,19 19,11;9,19 13,15 19,11;9,15 13,19 19,11" dur="1.2s"
                                        repeatCount="indefinite" />
                                </polyline>
                                <text x="14" y="18" text-anchor="middle" font-size="12" fill="#2196f3"
                                    font-weight="bold">S</text>
                            </svg>
                            จำนวนรายการขาย
                        </div>
                        <div id="count-sale" class="summary-value">-</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>
    </div>
<script>
      // ฟังก์ชันโหลดข้อมูล user profile
      async function loadUserProfile() {
        const userId = localStorage.getItem("userId");
        const username = localStorage.getItem("username");
        const role = localStorage.getItem("role");

        console.log("🔍 Loading user profile:", { userId, username, role });

        // แสดงชื่อและ role จาก localStorage
        if (username) {
          document.getElementById("userName").textContent = username;
        }

        if (role) {
          const roleBadge = document.querySelector(".role-badge");
          roleBadge.textContent =
            role === "admin" ? "ผู้ดูแลระบบ" : "ผู้ใช้งาน";
          roleBadge.className =
            role === "admin" ? "role-badge admin" : "role-badge user";
        }

        // โหลดรูปโปรไฟล์จาก database
        if (userId) {
          try {
            const BACKEND_URL = `http://${window.location.hostname}:3000`;
            const response = await fetch(`${BACKEND_URL}/api/users/all`);

            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }

            const users = await response.json();
            const currentUser = users.find((u) => u._id === userId);

            if (currentUser) {
              const avatarElement = document.getElementById("userAvatar");
              const avatarWrapper = document.querySelector(
                ".user-avatar-wrapper"
              );

              // ลบ placeholder เดิม (ถ้ามี)
              const existingPlaceholder = avatarWrapper.querySelector(
                ".user-avatar-placeholder"
              );
              if (existingPlaceholder) {
                existingPlaceholder.remove();
              }

              if (currentUser.profileImage) {
                avatarElement.src = currentUser.profileImage;
                avatarElement.style.display = "block";

                avatarElement.onerror = function () {
                  console.error("❌ Failed to load profile image");
                  this.style.display = "none";
                  createPlaceholder(avatarWrapper, username);
                };
              } else {
                avatarElement.style.display = "none";
                createPlaceholder(avatarWrapper, username);
              }
            } else {
              createPlaceholder(
                document.querySelector(".user-avatar-wrapper"),
                username
              );
            }
          } catch (error) {
            console.error("❌ Load user profile error:", error);
            createPlaceholder(
              document.querySelector(".user-avatar-wrapper"),
              username
            );
          }
        }
      }

      // show movement button only for admin
      const role = localStorage.getItem("role");
      const movementBtn = document.getElementById("movement-btn");
      if (role === "admin" && movementBtn) {
        movementBtn.style.display = "";
      } else if (movementBtn) {
        movementBtn.style.display = "none";
      }

       // show dashboard button only for admin
        const dashboardBtn = document.getElementById("dashboard-btn");
        if (role === "admin" && dashboardBtn) {
          dashboardBtn.style.display = "";
        } else if (dashboardBtn) {
          dashboardBtn.style.display = "none";
        }


      // ฟังก์ชันสร้าง placeholder
      function createPlaceholder(wrapper, username) {
        const avatar = wrapper.querySelector("#userAvatar");
        if (avatar) avatar.style.display = "none";

        const existingPlaceholder = wrapper.querySelector(
          ".user-avatar-placeholder"
        );
        if (existingPlaceholder) return;

        const placeholder = document.createElement("div");
        placeholder.className = "user-avatar-placeholder";
        placeholder.textContent = username
          ? username.charAt(0).toUpperCase()
          : "U";

        const indicator = wrapper.querySelector(".online-indicator");
        wrapper.insertBefore(placeholder, indicator);
      }

      // โหลด user profile เมื่อหน้าโหลดเสร็จ
      document.addEventListener("DOMContentLoaded", function () {
        loadUserProfile();

        // Hamburger menu
        const hamburger = document.getElementById("hamburger-btn");
        const sidebar = document.getElementById("sidebar");
        hamburger?.addEventListener("click", () => {
          sidebar.classList.toggle("sidebar-open");
        });
      });
    </script>

    <script type="module" src="../scripts/history.js"></script>
</body>

</html>
