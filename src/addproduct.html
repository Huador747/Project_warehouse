<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/addproduct.css" />
    <link rel="stylesheet" href="../styles/responsive/addproduct1180px.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0
"
    />
  </head>

  <body>
    <!-- Hamburger button -->
    <button class="hamburger" id="hamburger-btn" aria-label="เมนูนำทาง">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="sidebar" id="sidebar">
      <div class="sidebar-nav-btn">
        <!-- User Profile Section -->
        <div class="user-profile-section">
          <div class="user-avatar-wrapper">
            <img
              id="userAvatar"
              src=""
              alt="User Avatar"
              class="user-avatar"
              style="display: none"
            />
            <div class="online-indicator"></div>
          </div>
          <div class="user-info-text">
            <div id="userName" class="user-name">ผู้ใช้งาน</div>
            <div id="userRole" class="user-role">
              <span class="role-badge">User</span>
            </div>
          </div>
        </div>

        <button class="nav-btn" onclick="window.location.href='main.html'">
          <span class="nav-icon">🏠</span> หน้าหลัก
        </button>
        <button class="nav-btn" onclick="window.location.href='buyin.html'">
          <span class="nav-icon">🛒</span> รายการซื้อ
        </button>
        <button class="nav-btn" onclick="window.location.href='sale.html'">
          <span class="nav-icon">💸</span> รายการขาย
        </button>
        <button class="nav-btn" onclick="window.location.href='history.html'">
          <span class="nav-icon">📑</span> ประวัติการซื้อ-ขาย
        </button>
        <button
          class="nav-btn active"
          onclick="window.location.href='inventory.html'"
        >
          <span class="nav-icon">📦</span> สรุปจำนวนคงเหลือสินค้า
        </button>
        <button class="nav-btn" onclick="window.location.href='movement.html'">
          <span class="nav-icon">📈</span> กราฟการเคลื่อนไหวสินค้าและจำนวนเงิน
        </button>
      </div>
      <div class="logo-container">
        <img src="/assets/logo.png" alt="Logo" class="logo" />
      </div>
    </div>

    <!-- ย้าย navbar ออกมานอก main-content -->
    <div class="navbar">
      <form class="navbar-form">
        <span class="navbar-text active">หน้าเพิ่มสินค้า</span>
      </form>
      <button class="logout-btn" id="logout-btn">ออกจากระบบ</button>
    </div>

    <div class="main-content">
      <form class="product-form">
        <div class="product-form-row">
          <div class="product-form-col">
            <div class="form-group">
              <label for="product_code">รหัสสินค้า</label>
              <input
                type="text"
                id="product_code"
                name="product_code"
                required
              />
            </div>
            <div class="form-group">
              <label for="model">ชื่อโมเดล(ภาษาอังกฤษ)</label>
              <input type="text" id="model" name="model" required />
            </div>
            <div class="form-group">
              <label for="product_name">ชื่อสินค้า</label>
              <input type="text" id="product_name" name="product_name" />
            </div>
            <!-- ฟอร์มเลือกผู้ผลิต ------------------------------------------------->
            <div class="form-group">
              <label for="maker">ผู้ผลิต</label>
              <select id="maker" name="maker" required>
                <option value="">-- เลือกผู้ผลิต --</option>
                <option value="Sealey">Sealey</option>
                <!-- เพิ่มตามต้องการ -->
              </select>
            </div>
            <div class="add-maker-group">
              <input
                type="text"
                id="new-maker"
                placeholder="เพิ่มผู้ผลิตใหม่"
              />
              <button type="button" id="add-maker-btn">เพิ่ม</button>
            </div>

            <!-- ฟอร์มเลือกประเภทสินค้า ------------------------------------------------->
            <div class="form-group">
              <label for="category">ประเภทสินค้า</label>
              <select id="category" name="category" required>
                <option value="">-- เลือกประเภทสินค้า --</option>
                <option value="Tool">Tool</option>
                <!-- เพิ่มตามต้องการ -->
              </select>
              <div class="add-category-group">
                <input
                  type="text"
                  id="new-category"
                  placeholder="เพิ่มประเภทใหม่..."
                />
                <button type="button" id="add-category-btn">เพิ่ม</button>
              </div>
            </div>
          </div>
          <div class="product-form-col">
            <div class="form-group">
              <label for="condition">มือ1/มือ2</label>
              <select id="condition" name="condition" required>
                <option value="">-- เลือกสถานะ --</option>
                <option value="มือ1">มือ 1</option>
                <option value="มือ2">มือ 2</option>
              </select>
            </div>
            <div class="form-group">
              <label for="price">ราคาต้นทุน</label>
              <input type="number" id="price" name="price" step="0.01" />
            </div>
            <div class="form-group">
              <label for="sale_price">ราคาขาย</label>
              <input type="text" id="sale_price" name="sale_price" />
            </div>
            <div class="form-group">
              <label for="unit">หน่วยนับ</label>
              <select id="unit" name="unit" required>
                <option value="">-- เลือกหน่วยนับ --</option>
                <option value="ชิ้น">ชิ้น</option>
                <option value="กล่อง">กล่อง</option>
                <option value="ชุด">เซ็ท</option>
              </select>
            </div>
            <div class="add-unit-group">
              <input
                type="text"
                id="new-unit"
                placeholder="เพิ่มหน่วยนับใหม่"
              />
              <button type="button" id="add-unit-btn">เพิ่ม</button>
            </div>

            <div class="form-group">
              <label for="location">ตำแหน่งสินค้า</label>
              <select id="location" name="location" required>
                <option value="">-- เลือกตำแหน่ง --</option>
                <option value="Rack A">Rack A</option>
                <option value="RackB">Rack B</option>
                <option value="Rack C">Rack C</option>
                <option value="Rack D">Rack D</option>
              </select>
            </div>
            <div class="add-location-group">
              <input
                type="text"
                id="new-location"
                placeholder="เพิ่มตำแหน่งใหม่"
              />
              <button type="button" id="add-location-btn">เพิ่ม</button>
            </div>
            <!-- ย้ายฟอร์มแนบรูปภาพมาไว้ตรงนี้ -->
            <div class="form-group image-upload">
              <label for="image">แนบรูปภาพสินค้า</label>
              <input type="file" id="image" name="image" accept="image/*" />
            </div>
            <div
              id="image-preview"
              style="margin-top: 30px; display: flex; justify-content: center"
            ></div>
          </div>
        </div>
        <button type="submit" class="function-btn-add">บันทึกสินค้า</button>
      </form>
    </div>
    <!-- ปิด .main-content -->
    <script>
      // ฟังก์ชันโหลดข้อมูล user profile
      async function loadUserProfile() {
        const userId = localStorage.getItem("userId");
        const username = localStorage.getItem("username");
        const role = localStorage.getItem("role");

        console.log("🔍 Loading user profile:", { userId, username, role });

        // แสดงชื่อและ role จาก localStorage
        if (username) {
          document.getElementById("userName").textContent = username;
        }

        if (role) {
          const roleBadge = document.querySelector(".role-badge");
          roleBadge.textContent =
            role === "admin" ? "ผู้ดูแลระบบ" : "ผู้ใช้งาน";
          roleBadge.className =
            role === "admin" ? "role-badge admin" : "role-badge user";
        }

        // โหลดรูปโปรไฟล์จาก database
        if (userId) {
          try {
            const BACKEND_URL = `http://${window.location.hostname}:3000`;
            const response = await fetch(`${BACKEND_URL}/api/users/all`);

            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }

            const users = await response.json();
            const currentUser = users.find((u) => u._id === userId);

            if (currentUser) {
              const avatarElement = document.getElementById("userAvatar");
              const avatarWrapper = document.querySelector(
                ".user-avatar-wrapper"
              );

              // ลบ placeholder เดิม (ถ้ามี)
              const existingPlaceholder = avatarWrapper.querySelector(
                ".user-avatar-placeholder"
              );
              if (existingPlaceholder) {
                existingPlaceholder.remove();
              }

              if (currentUser.profileImage) {
                avatarElement.src = currentUser.profileImage;
                avatarElement.style.display = "block";

                avatarElement.onerror = function () {
                  console.error("❌ Failed to load profile image");
                  this.style.display = "none";
                  createPlaceholder(avatarWrapper, username);
                };
              } else {
                avatarElement.style.display = "none";
                createPlaceholder(avatarWrapper, username);
              }
            } else {
              createPlaceholder(
                document.querySelector(".user-avatar-wrapper"),
                username
              );
            }
          } catch (error) {
            console.error("❌ Load user profile error:", error);
            createPlaceholder(
              document.querySelector(".user-avatar-wrapper"),
              username
            );
          }
        }
      }

      // ฟังก์ชันสร้าง placeholder
      function createPlaceholder(wrapper, username) {
        const avatar = wrapper.querySelector("#userAvatar");
        if (avatar) avatar.style.display = "none";

        const existingPlaceholder = wrapper.querySelector(
          ".user-avatar-placeholder"
        );
        if (existingPlaceholder) return;

        const placeholder = document.createElement("div");
        placeholder.className = "user-avatar-placeholder";
        placeholder.textContent = username
          ? username.charAt(0).toUpperCase()
          : "U";

        const indicator = wrapper.querySelector(".online-indicator");
        wrapper.insertBefore(placeholder, indicator);
      }

      // โหลด user profile เมื่อหน้าโหลดเสร็จ
      document.addEventListener("DOMContentLoaded", function () {
        loadUserProfile();

        // Hamburger menu
        const hamburger = document.getElementById("hamburger-btn");
        const sidebar = document.getElementById("sidebar");
        hamburger?.addEventListener("click", () => {
          sidebar.classList.toggle("sidebar-open");
        });
      });
    </script>

    <script type="module" src="../scripts/addproduct.js"></script>
  </body>
</html>
