    <!--- ใช้งาน scripts ภายใน --->
    <script>
      function checkLogin() {
        const isLoggedIn = localStorage.getItem("isLoggedIn");
        if (!isLoggedIn) {
          window.location.replace("login.html");
        }
      }

      // เรียกใช้ฟังก์ชันตรวจสอบเมื่อโหลดหน้า
      document.addEventListener("DOMContentLoaded", function () {
        checkLogin();
        loadUserProfile(); // โหลดข้อมูล user
        
        // Show movement button only for admin
        const role = localStorage.getItem("role");
        const movementBtn = document.getElementById("movement-btn");
        if (role === "admin" && movementBtn) {
          movementBtn.style.display = "";
        } else if (movementBtn) {
          movementBtn.style.display = "none";
        }

        // show dashboard button only for admin
        const dashboardBtn = document.getElementById("dashboard-btn");
        if (role === "admin" && dashboardBtn) {
          dashboardBtn.style.display = "";
        } else if (dashboardBtn) {
          dashboardBtn.style.display = "none";
        }

        // Hamburger menu
        const hamburger = document.getElementById("hamburger-btn");
        const sidebar = document.getElementById("sidebar");
        hamburger?.addEventListener("click", () => {
          sidebar.classList.toggle("sidebar-open");
        });

        // แยก logout handler ออกมา
        const logoutBtn = document.querySelector(".logout-btn");
        logoutBtn?.addEventListener("click", function (e) {
          e.preventDefault();
          localStorage.clear();
          sessionStorage.clear();
          window.location.replace("login.html");
        });

        // แยก navigation handlers
        const addProductBtn = document.querySelector(".function-btn-add");
        addProductBtn?.addEventListener("click", function (e) {
          e.preventDefault();
          window.location.href = "addproduct.html";
        });

        const editProductBtn = document.querySelector(".function-btn-edit");
        editProductBtn?.addEventListener("click", function (e) {
          e.preventDefault();
          window.location.href = "editproduct.html";
        });

      });

      // ฟังก์ชันโหลดข้อมูล user profile จาก database
      async function loadUserProfile() {
        const userId = localStorage.getItem('userId');
        const username = localStorage.getItem('username');
        const role = localStorage.getItem('role');

        console.log('🔍 Loading user profile:', { userId, username, role });

        // แสดงชื่อและ role จาก localStorage
        if (username) {
          document.getElementById('userName').textContent = username;
        }

        if (role) {
          const roleBadge = document.querySelector('.role-badge');
          roleBadge.textContent = role === 'admin' ? 'ผู้ดูแลระบบ' : 'ผู้ใช้งาน';
          roleBadge.className = role === 'admin' ? 'role-badge admin' : 'role-badge user';
        }

        // โหลดรูปโปรไฟล์จาก database
        if (userId) {
          try {
            const BACKEND_URL = `http://${window.location.hostname}:3000`;
            const response = await fetch(`${BACKEND_URL}/api/users/all`);
            
            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            const users = await response.json();
            console.log('📥 Users loaded:', users.length);
            
            const currentUser = users.find(u => u._id === userId);

            if (currentUser) {
              console.log('✅ Current user found:', currentUser.username);
              
              const avatarElement = document.getElementById('userAvatar');
              const avatarWrapper = document.querySelector('.user-avatar-wrapper');
              
              // ลบ placeholder เดิม (ถ้ามี)
              const existingPlaceholder = avatarWrapper.querySelector('.user-avatar-placeholder');
              if (existingPlaceholder) {
                existingPlaceholder.remove();
              }

              if (currentUser.profileImage) {
                // แสดงรูปจาก database (Base64)
                console.log('🖼️ Profile image found, size:', (currentUser.profileImage.length / 1024).toFixed(2), 'KB');
                avatarElement.src = currentUser.profileImage;
                avatarElement.style.display = 'block';
                
                // Handle image load error
                avatarElement.onerror = function() {
                  console.error('❌ Failed to load profile image');
                  this.style.display = 'none';
                  createPlaceholder(avatarWrapper, username);
                };
              } else {
                // ไม่มีรูป - ใช้ placeholder
                console.log('ℹ️ No profile image, using placeholder');
                avatarElement.style.display = 'none';
                createPlaceholder(avatarWrapper, username);
              }
            } else {
              console.warn('⚠️ User not found in database');
              createPlaceholder(document.querySelector('.user-avatar-wrapper'), username);
            }
          } catch (error) {
            console.error('❌ Load user profile error:', error);
            // Fallback to placeholder on error
            createPlaceholder(document.querySelector('.user-avatar-wrapper'), username);
          }
        } else {
          console.warn('⚠️ No userId in localStorage');
        }
      }

      // ฟังก์ชันสร้าง placeholder
      function createPlaceholder(wrapper, username) {
        const avatar = wrapper.querySelector('#userAvatar');
        if (avatar) avatar.style.display = 'none';
        
        const existingPlaceholder = wrapper.querySelector('.user-avatar-placeholder');
        if (existingPlaceholder) return; // มีอยู่แล้ว
        
        const placeholder = document.createElement('div');
        placeholder.className = 'user-avatar-placeholder';
        placeholder.textContent = username ? username.charAt(0).toUpperCase() : 'U';
        
        // ใส่ก่อน online indicator
        const indicator = wrapper.querySelector('.online-indicator');
        wrapper.insertBefore(placeholder, indicator);
      }
    </script>

    font-size: 20px;
    min-width: 24px;
  }

  /* Logo */
  .logo-container {
    width: 100px;
    height: 100px;
    margin-bottom: 60px;
  }

  .logo {
    width: 120px;
    height: 120px;
  }

  /* Image modal */
  .image-modal img {
    max-width: 90vw;
    max-height: 70vh;
  }

  .close-modal {
    top: 16px;
    right: 16px;
    font-size: 2rem;
  }
}

/* ========== Small Mobile (< 480px) ========== */
@media screen and (max-width: 480px) {
  .navbar {
    min-height: 50px;
    padding: 6px 8px;
  }

  .hamburger {
    top: 25px;
    left: 10px;
    width: 32px;
    height: 32px;
  }

  .hamburger span {
    width: 20px;
    height: 2.5px;
  }

  .main-content {
    margin-top: 50px;
  }

  .navbar-text {
    font-size: 10px;
    padding: 3px 5px;
  }

  .stat-icon {
    width: 18px;
    height: 18px;
  }

  .logout-btn {
    height: 36px;
    font-size: 12px;
    padding: 5px 10px;
  }

  .function-buttons {
    padding: 8px 10px;
    gap: 6px;
  }

  .search-product-input {
    height: 36px;
    font-size: 13px;
    padding: 5px 10px;
  }

  .function-btn-add,
  .function-btn-edit {
    height: 38px;
    font-size: 13px;
    padding: 6px 10px;
  }

  .product-table {
    margin: 10px 6px;
    padding: 10px;
  }

  .product-table table {
    min-width: 500px;
    font-size: 10px;
  }

  .product-table th,
  .product-table td {
    font-size: 10px;
    padding: 4px 2px;
    min-width: 50px;
  }

  .product-table td img {
    width: 120px;
    height: 120px;
  }

  .product-table td:last-child {
    width: 70px;
    min-width: 70px;
  }

  .pagination-controls {
    padding: 8px 12px;
    gap: 6px;
    flex-wrap: wrap;
  }

  .pagination-controls button {
    padding: 5px 8px;
    font-size: 11px;
    min-width: 60px;
  }

  #page-info {
    font-size: 0.85rem;
    width: 100%;
    text-align: center;
    margin-top: 4px;
  }

  .sidebar {
    width: 90%;
    max-width: 100%;
  }

  .user-avatar,
  .user-avatar-placeholder {
    width: 60px;
    height: 60px;
    font-size: 24px;
  }

  .user-name {
    font-size: 15px;
  }

  .role-badge {
    font-size: 11px;
    padding: 3px 8px;
  }

  .sidebar-nav-btn .nav-btn {
    font-size: 14px;
    padding: 10px 12px;
  }

  .logo {
    width: 100px;
    height: 100px;
  }
}

/* ========== Landscape Mobile ========== */
@media (max-height: 600px) and (orientation: landscape) {
  .sidebar {
    overflow-y: auto;
  }

  .user-profile-section {
    padding: 12px 10px;
  }

  .user-avatar,
  .user-avatar-placeholder {
    width: 55px;
    height: 55px;
    font-size: 22px;
  }

  .sidebar-nav-btn .nav-btn {
    padding: 8px 12px;
    font-size: 14px;
  }

  .logo-container {
    padding: 10px;
    margin-bottom: 40px;
  }

  .logo {
    width: 80px;
    height: 80px;
  }

  .navbar {
    min-height: 50px;
  }

  .main-content {
    margin-top: 50px;
  }
}

/* ========== Print Styles ========== */
@media print {
  .hamburger,
  .sidebar,
  .navbar,
  .function-buttons,
  .pagination-controls {
    display: none !important;
  }

  .main-content {
    margin: 0;
  }

  .product-table {
    box-shadow: none;
    margin: 0;
    padding: 0;
  }

  .product-table th,
  .product-table td {
    border: 1px solid #000;
  }
}

/* ========== Accessibility ========== */
@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ========== High Contrast Mode ========== */
@media (prefers-contrast: high) {
  .sidebar {
    border-right: 2px solid #000;
  }

  .sidebar-nav-btn .nav-btn {
    border: 1px solid rgba(0, 0, 0, 0.5);
  }

  .navbar {
    border-bottom: 2px solid #000;
  }

  .product-table th,
  .product-table td {
    border: 2px solid #000;
  }
}
/* ========== END RESPONSIVE ========== */
