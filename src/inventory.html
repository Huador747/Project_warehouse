        <script>
          (function () {
            function syncFromSelect() {
              const select = document.getElementById("status-filter");
              const normal = document.getElementById("cb-status-normal");
              const paused = document.getElementById("cb-status-paused");
              if (!select || !normal || !paused) return;

              if (select.value === "ขายปกติ") {
                normal.checked = true;
                paused.checked = false;
              } else if (select.value === "พักการขาย") {
                normal.checked = false;
                paused.checked = true;
              } else {
                normal.checked = true;
                paused.checked = true;
              }
            }

            function syncToSelect() {
              const select = document.getElementById("status-filter");
              const normal = document.getElementById("cb-status-normal");
              const paused = document.getElementById("cb-status-paused");
              if (!select || !normal || !paused) return;

              let value = "";
              if (normal.checked && !paused.checked) value = "ขายปกติ";
              else if (!normal.checked && paused.checked) value = "พักการขาย";
              else value = "";

              select.value = value;
              select.dispatchEvent(new Event("change", { bubbles: true }));
            }

            function init() {
              const normal = document.getElementById("cb-status-normal");
              const paused = document.getElementById("cb-status-paused");
              const select = document.getElementById("status-filter");
              if (!normal || !paused || !select) return;

              normal.addEventListener("change", syncToSelect);
              paused.addEventListener("change", syncToSelect);
              select.addEventListener("change", syncFromSelect);
              syncFromSelect();
            }

            if (document.readyState === "loading") {
              document.addEventListener("DOMContentLoaded", init);
            } else {
              init();
            }
          })();
        </script>

    <script>
      // ฟังก์ชันโหลดข้อมูล user profile
      async function loadUserProfile() {
        const userId = localStorage.getItem("userId");
        const username = localStorage.getItem("username");
        const role = localStorage.getItem("role");

        console.log("🔍 Loading user profile:", { userId, username, role });

        // แสดงชื่อและ role จาก localStorage
        if (username) {
          document.getElementById("userName").textContent = username;
        }

        if (role) {
          const roleBadge = document.querySelector(".role-badge");
          roleBadge.textContent =
            role === "admin" ? "ผู้ดูแลระบบ" : "ผู้ใช้งาน";
          roleBadge.className =
            role === "admin" ? "role-badge admin" : "role-badge user";
        }

        // โหลดรูปโปรไฟล์จาก database
        if (userId) {
          try {
            const BACKEND_URL = `http://${window.location.hostname}:3000`;
            const response = await fetch(`${BACKEND_URL}/api/users/all`);

            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }

            const users = await response.json();
            const currentUser = users.find((u) => u._id === userId);

            if (currentUser) {
              const avatarElement = document.getElementById("userAvatar");
              const avatarWrapper = document.querySelector(
                ".user-avatar-wrapper",
              );

              // ลบ placeholder เดิม (ถ้ามี)
              const existingPlaceholder = avatarWrapper.querySelector(
                ".user-avatar-placeholder",
              );
              if (existingPlaceholder) {
                existingPlaceholder.remove();
              }

              if (currentUser.profileImage) {
                avatarElement.src = currentUser.profileImage;
                avatarElement.style.display = "block";

                avatarElement.onerror = function () {
                  console.error("❌ Failed to load profile image");
                  this.style.display = "none";
                  createPlaceholder(avatarWrapper, username);
                };
              } else {
                avatarElement.style.display = "none";
                createPlaceholder(avatarWrapper, username);
              }
            } else {
              createPlaceholder(
                document.querySelector(".user-avatar-wrapper"),
                username,
              );
            }
          } catch (error) {
            console.error("❌ Load user profile error:", error);
            createPlaceholder(
              document.querySelector(".user-avatar-wrapper"),
              username,
            );
          }
        }
      }


      // show movement button only for admin
      const role = localStorage.getItem("role");
      const movementBtn = document.getElementById("movement-btn");
      if (role === "admin" && movementBtn) {
        movementBtn.style.display = "";
      } else if (movementBtn) {
        movementBtn.style.display = "none";
      }

      // show dashboard button only for admin
      const dashboardBtn = document.getElementById("dashboard-btn");
      if (role === "admin" && dashboardBtn) {
        dashboardBtn.style.display = "";
      } else if (dashboardBtn) {
        dashboardBtn.style.display = "none";
      }

      // ซ่อนปุ่ม Report สำหรับ user
      const reportBtn = document.getElementById("report-btn");
      if (role !== "admin" && reportBtn) {
        reportBtn.style.display = "none";
      }

      // ฟังก์ชันสร้าง placeholder
      function createPlaceholder(wrapper, username) {
        const avatar = wrapper.querySelector("#userAvatar");
        if (avatar) avatar.style.display = "none";

        const existingPlaceholder = wrapper.querySelector(
          ".user-avatar-placeholder",
        );
        if (existingPlaceholder) return;

        const placeholder = document.createElement("div");
        placeholder.className = "user-avatar-placeholder";
        placeholder.textContent = username
          ? username.charAt(0).toUpperCase()
          : "U";

        const indicator = wrapper.querySelector(".online-indicator");
        wrapper.insertBefore(placeholder, indicator);
      }

      // โหลด user profile เมื่อหน้าโหลดเสร็จ
      document.addEventListener("DOMContentLoaded", function () {
        loadUserProfile();

        // Hamburger menu
        const hamburger = document.getElementById("hamburger-btn");
        const sidebar = document.getElementById("sidebar");
        hamburger?.addEventListener("click", () => {
          sidebar.classList.toggle("sidebar-open");
        });
      });
    </script>
