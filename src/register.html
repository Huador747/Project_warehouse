<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/register.css">
    <title>ลงทะเบียน - Project Warehouse</title>
</head>

<body>
    <div class="register-container">
        <a href="login.html" class="back-btn" title="ย้อนกลับ">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M15 18l-6-6 6-6" stroke="#667eea" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
        </a>

        <div class="register-image-frame" id="imageFrame">
            <label for="profile-upload" class="register-upload-label" id="imageLabel">
                <svg class="register-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="48" height="48">
                    <rect x="32" y="144" width="448" height="320" rx="40" fill="#cceeff" stroke="#222" stroke-width="16" />
                    <rect x="32" y="144" width="448" height="160" fill="#ff6680" stroke="#222" stroke-width="16" />
                    <circle cx="256" cy="304" r="96" fill="#fff" stroke="#222" stroke-width="16" />
                    <circle cx="256" cy="304" r="56" fill="#fff" stroke="#222" stroke-width="16" />
                    <rect x="160" y="64" width="192" height="80" rx="32" fill="#cceeff" stroke="#222" stroke-width="16" />
                    <rect x="64" y="192" width="384" height="224" rx="32" fill="none" stroke="#222" stroke-width="8" />
                    <circle cx="400" cy="192" r="12" fill="#222" />
                    <circle cx="368" cy="192" r="12" fill="#222" />
                </svg>
                <input type="file" id="profile-upload" accept="image/*" style="display: none;">
            </label>
        </div>

        <h2>ลงทะเบียน</h2>

        <form id="register-form">
            <div class="register-group">
                <input type="text" id="username" name="username" required placeholder=" " autocomplete="username"
                    minlength="3" />
                <label for="username">ชื่อผู้ใช้</label>
            </div>

            <div class="register-group">
                <input type="password" id="password" name="password" required placeholder=" " autocomplete="new-password"
                    minlength="4" />
                <label for="password">รหัสผ่าน</label>
            </div>

            <input type="submit" value="ลงทะเบียน" id="submitBtn">
        </form>

        <div class="helper-text">
            มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a>
        </div>
    </div>

    <script>
        const BACKEND_URL = `http://${window.location.hostname}:3000`;
        let profileImage = null;

        // ========== Preview รูปภาพเมื่อเลือกไฟล์ ==========
        document.getElementById('profile-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            // ตรวจสอบขนาดไฟล์ (สูงสุด 5MB)
            if (file.size > 5 * 1024 * 1024) {
                showCustomModal({
                    icon: "error",
                    title: "ขนาดไฟล์เกินขีดจำกัด",
                    text: "❌ ขนาดไฟล์ใหญ่เกินไป (สูงสุด 5MB)",
                    confirmText: "ตกลง"
                });
                this.value = '';
                return;
            }

            // ตรวจสอบประเภทไฟล์
            const allowedTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/gif'];
            if (!allowedTypes.includes(file.type)) {
                showCustomModal({
                    icon: "error",
                    title: "ประเภทไฟล์ไม่ถูกต้อง",
                    text: "❌ รองรับเฉพาะไฟล์ JPG, PNG, GIF เท่านั้น",
                    confirmText: "ตกลง"
                });
                this.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                // แสดงตัวอย่างรูปภาพ
                const imageLabel = document.getElementById('imageLabel');
                imageLabel.innerHTML = `<img src="${e.target.result}" alt="Profile Preview" style="width: 100%; height: 100%; object-fit: cover;">`;

                // เก็บข้อมูลรูปภาพแบบ Base64
                profileImage = e.target.result;
                console.log('✅ รูปภาพถูกเลือกแล้ว (ขนาด:', (profileImage.length / 1024).toFixed(2), 'KB)');
            }
            reader.readAsDataURL(file);
        });

        // ========== จัดการ Form Submission ==========
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            // Validation
            if (username.length < 3) {
                alert('❌ ชื่อผู้ใช้ต้องมีความยาวอย่างน้อย 3 ตัวอักษร');
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
                return;
            }

            if (password.length < 4) {
                alert('❌ รหัสผ่านต้องมีความยาวอย่างน้อย 4 ตัวอักษร');
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
                return;
            }

            // สร้าง payload
            const payload = {
                username: username,
                password: password,
                profileImage: profileImage // Base64 string หรือ null
            };

            console.log('📤 ส่งข้อมูลไปยัง backend:', {
                username: payload.username,
                password: '***',
                profileImage: profileImage ? `${(profileImage.length / 1024).toFixed(2)} KB` : 'ไม่มี'
            });

            try {
                const response = await fetch(`${BACKEND_URL}/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    showCustomModal({
                        icon: "success",
                        title: "ลงทะเบียนสำเร็จ",
                        text: "🎉 คุณได้ลงทะเบียนเรียบร้อยแล้ว! กรุณาเข้าสู่ระบบเพื่อใช้งาน",
                        confirmText: "เข้าสู่ระบบ",
                        onClose: () => {
                            window.location.href = 'login.html';
                        }
                    });
                } else if (response.status === 409) {
                    showCustomModal({
                        icon: "error",
                        title: "ลงทะเบียนไม่สำเร็จ",
                        text: data.message || "ชื่อผู้ใช้นี้มีอยู่แล้วหรือข้อมูลไม่ถูกต้อง",
                        confirmText: "ตกลง"
                    });
                } else {
                    showCustomModal({
                        icon: "error",
                        title: "ลงทะเบียนไม่สำเร็จ",
                        text: data.message || "เกิดข้อผิดพลาดในการลงทะเบียน",
                        confirmText: "ตกลง"
                    });
                }
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
            } catch (error) {
                console.error('❌ Connection error:', error);
                alert('❌ เกิดข้อผิดพลาดในการเชื่อมต่อ: ' + error.message);
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
            }
        });

    // Custom Modal สำหรับแจ้งเตือน
    function showCustomModal({ title = "", text = "", icon = "success", confirmText = "ตกลง", onClose = null }) {
    // ลบ modal เดิมถ้ามี
    document.getElementById("custom-modal")?.remove();

    // สร้าง modal
    const modal = document.createElement("div");
    modal.id = "custom-modal";
    modal.style.position = "fixed";
    modal.style.top = "0";
    modal.style.left = "0";
    modal.style.width = "100vw";
    modal.style.height = "100vh";
    modal.style.background = "rgba(0,0,0,0.35)";
    modal.style.zIndex = "99999";
    modal.style.display = "flex";
    modal.style.alignItems = "center";
    modal.style.justifyContent = "center";
    modal.innerHTML = `
      <div style="
        background: #fffbe9;
        border-radius: 18px;
        box-shadow: 0 8px 32px rgba(30,41,59,0.18);
        padding: 32px 28px 24px 28px;
        min-width: 320px;
        max-width: 90vw;
        text-align: center;
        position: relative;
        font-family: 'Sarabun', sans-serif;
      ">
        <div style="font-size: 2.5rem; margin-bottom: 12px;">
          ${icon === "success" ? "✅" : icon === "error" ? "❌" : "ℹ️"}
        </div>
        <div style="font-size: 1.35rem; font-weight: bold; color: #d35400; margin-bottom: 10px;">
          ${title}
        </div>
        <div style="font-size: 1.1rem; color: #333; margin-bottom: 22px;">
          ${text}
        </div>
        <button id="custom-modal-confirm" style="
          padding: 10px 36px;
          font-size: 1.1rem;
          border-radius: 8px;
          background: #ffd336;
          border: none;
          cursor: pointer;
          color: #333;
          font-weight: 600;
          box-shadow: 0 2px 8px rgba(0,0,0,0.08);
          transition: background 0.2s;
        ">${confirmText}</button>
      </div>
    `;
    document.body.appendChild(modal);

    document.getElementById("custom-modal-confirm").onclick = () => {
        modal.remove();
        if (typeof onClose === "function") onClose();
    };
}
    </script>
</body>

</html>
