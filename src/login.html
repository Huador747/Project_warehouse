<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles/login.css" />
    <title>เข้าสู่ระบบ - Project Warehouse</title>
</head>
<body>
    <div class="login-container">
        <div class="login-left">
            <div class="logo-container">
                <img src="../assets/logo.png" alt="Project Warehouse Logo" class="logo" />
            </div>
        </div>
        
        <div class="login-right">
            <h2>เข้าสู่ระบบ</h2>
            
            <form id="login-form">
                <div class="login-group">
                    <input type="text" id="username" name="username" required placeholder=" " autocomplete="username" />
                    <label for="username">ชื่อผู้ใช้</label>
                </div>
                
                <div class="login-group">
                    <input type="password" id="password" name="password" required placeholder=" " autocomplete="current-password" />
                    <label for="password">รหัสผ่าน</label>
                </div>
                
                <input type="submit" value="เข้าสู่ระบบ" />
                <button type="button" id="register-btn">ลงทะเบียน</button>
            </form>
            
            <div class="login-links">
                <a href="#">ลืมรหัสผ่าน?</a>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = `http://${window.location.hostname}:3000`;

        // Login Function
        async function loginUser(username, password) {
            const submitBtn = document.querySelector('input[type="submit"]');
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;

            try {
                const response = await fetch(`${BACKEND_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.message === 'เข้าสู่ระบบสำเร็จ') {
                    // บันทึก userId ด้วย
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('username', username);
                    localStorage.setItem('role', data.role);
                    localStorage.setItem('userId', data.userId); // ++ เพิ่มบรรทัดนี้
                    
                    // Redirect based on role
                    if (data.role === 'admin') {
                        window.location.href = '/backend/src/dashboard.html';
                    } else {
                        window.location.href = '/main.html';
                    }
                } else {
                    alert('❌ ' + data.message);
                    submitBtn.classList.remove('loading');
                    submitBtn.disabled = false;
                }
            } catch (error) {
                alert('❌ เกิดข้อผิดพลาดในการเข้าสู่ระบบ: ' + error.message);
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
            }
        }

        // Form Submit
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            await loginUser(username, password);
        });

        // Enter Key
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value.trim();
                if (username && password) {
                    loginUser(username, password);
                }
            }
        });

        // Register Button
        document.getElementById('register-btn').addEventListener('click', function() {
            window.location.href = 'register.html';
        });
    </script>
</body>
</html>
