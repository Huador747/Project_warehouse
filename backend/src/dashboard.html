<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link
      href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/backend/style/dashboard.css" />
    <title>Admin Dashboard</title>
  </head>
  <body>
    <div class="dashboard-container">
      <aside class="sidebar">
            <div class="logo">
                <h2>📦 Admin-panel</h2>
            </div>
            <nav class="nav-menu">
               <a href="dashboard.html" class="nav-item active">
                    <span class="icon">👥</span>
                    <span>แอดมินแดชบอร์ด</span>
                </a>
                 <a href="management.html" class="nav-item">
                    <span class="icon">👥</span>
                    <span>จัดการผู้ใช้งาน</span>
                </a>
                <a href="../../src/inventory.html" class="nav-item">
                    <span class="icon">📊</span>
                    <span>คลังสินค้า</span>
                </a>
                <a href="../../src/buyin.html" class="nav-item">
                    <span class="icon">📥</span>
                    <span>รับสินค้าเข้า</span>
                </a>
                <a href="../../src/sale.html" class="nav-item">
                    <span class="icon">💰</span>
                    <span>ขายสินค้า</span>
                </a>
                <a href="../../src/history.html" class="nav-item">
                    <span class="icon">📜</span>
                    <span>ประวัติการทำรายการ</span>
                </a>
                <a href="../../src/movement.html" class="nav-item">
                    <span class="icon">📋</span>
                    <span>รายงานความเคลื่อนไหว</span>
                </a>
            </nav>
        </aside>
      <main class="main-content">
        <section class="overview">
          <h3>Overview</h3>
          <div class="stats">
            <div class="stat-card">
              <div class="stat-title">Total Users</div>
              <div class="stat-value" id="total-users" style="color: #25a106">
                -
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-title">Admin Users</div>
              <div class="stat-value" id="admin-users" style="color: #e74c3c">
                -
              </div>
            </div>
          </div>
        </section>
        <section class="user-list-section">
          <h3>User Management</h3>
          <table class="user-table">
            <thead>
              <tr>
                <th>Profile</th>
                <th>Username</th>
                <th>Role</th>
                <th>สร้างบัญชีเมื่อ</th>
                <th>การใช้งาน</th>
                <th>สถานะ</th>
                <th>เข้าสู่ระบบล่าสุด</th>
              </tr>
            </thead>
            <tbody id="user-list">
              <!-- User rows will be rendered here -->
            </tbody>
          </table>
        </section>
      </main>
    </div>
    <script src="/scripts/config.js"></script>
    <!-- เอา inline script เดิมออก -->
  </body>
  <script src="/backend/script/dashboard.js"></script>
</html>
